name: Sleep History Production

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source
        required: false
        default: manual
      resume_archive_only:
        description: Resume archive verification and Telegram review only
        required: false
        type: boolean
        default: false
  schedule:
    # 12:30 Dubai (08:30 UTC): always after the Gemini daily quota reset
    # (midnight Pacific = 07:00 UTC in summer, 08:00 UTC in winter).
    - cron: "30 8 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: sleep-history-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install media and Python dependencies
        id: install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore latest failed-run checkpoint
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/restore_failure_checkpoint.py
      - name: Produce and upload review copy to Internet Archive
        id: produce
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE_ID: ${{ secrets.GEMINI_TTS_VOICE_ID }}
          GEMINI_TTS_VOICE_NAME: ${{ secrets.GEMINI_TTS_VOICE_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IAS3_ACCESS_KEY: ${{ secrets.IAS3_ACCESS_KEY }}
          IAS3_SECRET_KEY: ${{ secrets.IAS3_SECRET_KEY }}
          GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          PINK_NOISE_URL: ${{ secrets.PINK_NOISE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${{ inputs.resume_archive_only }}" == "true" ]]; then
            python scripts/cloud_pipeline.py resume-review
          else
            python scripts/cloud_pipeline.py produce
          fi
      - name: Request owner review
        if: success() && inputs.resume_archive_only != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cloud_pipeline.py notify-review
      - name: Notify Telegram about failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          PRODUCE_OUTCOME: ${{ steps.produce.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
      - name: Preserve diagnostic logs after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sleep-history-failure-${{ github.run_id }}
          # Resume checkpoint: in-progress work including generated voice chunks
          # (audio_chunks/*.mp3) is kept so no quota is wasted on a retry. Only
          # final outputs (video, full narration, review audio) are excluded.
          path: |
            logs/*.log
            stories/**
            !stories/**/*.mp4
            !stories/**/12_audio_full.mp3
            !stories/**/12_audio_narration.mp3
            !stories/**/13_audio_review.opus
            !stories/**/*.wav
            !stories/**/*.m4a
          if-no-files-found: warn
          retention-days: 7
      - name: Persist topic and archive catalogues
        if: always()
        run: python scripts/git_sync.py
