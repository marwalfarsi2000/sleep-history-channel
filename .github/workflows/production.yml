name: Sleep History Production

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source
        required: false
        default: manual
      resume_archive_only:
        description: Resume archive verification and Telegram review only
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 22 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: sleep-history-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install media and Python dependencies
        id: install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore latest failed-run checkpoint
        id: restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/restore_failure_checkpoint.py
      - name: Produce private review package
        id: produce
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE_ID: ${{ secrets.GEMINI_TTS_VOICE_ID }}
          GEMINI_TTS_VOICE_NAME: ${{ secrets.GEMINI_TTS_VOICE_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IAS3_ACCESS_KEY: ${{ secrets.IAS3_ACCESS_KEY }}
          IAS3_SECRET_KEY: ${{ secrets.IAS3_SECRET_KEY }}
          PINK_NOISE_URL: ${{ secrets.PINK_NOISE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${{ inputs.resume_archive_only }}" == "true" ]]; then
            python scripts/cloud_pipeline.py resume-review
          else
            python scripts/cloud_pipeline.py produce
          fi
      - name: Save private review package
        if: success() && inputs.resume_archive_only != true
        uses: actions/upload-artifact@v4
        with:
          name: sleep-history-review-${{ github.run_id }}
          path: |
            stories/**
          if-no-files-found: error
          retention-days: 30
      - name: Request owner review
        if: success() && inputs.resume_archive_only != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cloud_pipeline.py notify-review
      - name: Notify Telegram about failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          PRODUCE_OUTCOME: ${{ steps.produce.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/notify_failure.py
      - name: Preserve diagnostic logs after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sleep-history-failure-${{ github.run_id }}
          path: |
            logs/*.log
            stories/**
          if-no-files-found: warn
          retention-days: 7
      - name: Persist topic and archive catalogues
        if: always()
        run: |
          git config user.name "sleep-history-bot"
          git config user.email "marwalfarsi2000@gmail.com"
          git add config/topics_history.json config/archive_index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sleep history catalogue"
            git push
          fi
