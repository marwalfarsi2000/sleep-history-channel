name: Sleep History Targeted Review Repair

# Resumable across runners: every completed unit (background, thumbnail, each TTS chunk, narration, audio mix,
# video) is uploaded as an immutable checkpoint artifact; the next run restores and verifies them and only
# produces what is missing. Internet Archive is touched only after every output has passed QC.

on:
  workflow_dispatch:
    inputs:
      identifier:
        description: Internet Archive identifier of the REVIEW_PENDING item to repair
        required: true
      dry_run:
        description: Rebuild and validate only; upload nothing
        required: false
        default: "false"

permissions:
  actions: read
  contents: write

concurrency:
  group: repair-review-${{ inputs.identifier }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_VOICE_ID: ${{ secrets.GEMINI_TTS_VOICE_ID }}
      GEMINI_TTS_VOICE_NAME: ${{ secrets.GEMINI_TTS_VOICE_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      IAS3_ACCESS_KEY: ${{ secrets.IAS3_ACCESS_KEY }}
      IAS3_SECRET_KEY: ${{ secrets.IAS3_SECRET_KEY }}
      PINK_NOISE_URL: ${{ secrets.PINK_NOISE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure automation-state branch and hydrate runtime state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/state_store.py ensure
          python3 scripts/state_store.py hydrate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Repair unit 1
        id: u1
        uses: ./.github/actions/repair-unit
        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Repair unit 2
        id: u2
        if: steps.u1.outputs.more == 'true'
        uses: ./.github/actions/repair-unit
        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Repair unit 3
        id: u3
        if: steps.u2.outputs.more == 'true'
        uses: ./.github/actions/repair-unit
        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Repair unit 4
        id: u4
        if: steps.u3.outputs.more == 'true'
        uses: ./.github/actions/repair-unit
        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Repair unit 5
        id: u5
        if: steps.u4.outputs.more == 'true'
        uses: ./.github/actions/repair-unit
        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Repair unit 6
        id: u6
        if: steps.u5.outputs.more == 'true'
        uses: ./.github/actions/repair-unit
        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Repair unit 7
        id: u7
        if: steps.u6.outputs.more == 'true'
        uses: ./.github/actions/repair-unit
        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Repair unit 8
        id: u8
