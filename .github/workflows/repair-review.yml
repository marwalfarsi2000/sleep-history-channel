        with:
          identifier: ${{ inputs.identifier }}
          dry_run: ${{ inputs.dry_run }}
      - name: Report repair status
        if: always()
        run: |
          echo "unit 28 status: ${{ steps.u28.outputs.status }} / more: ${{ steps.u28.outputs.more }}"
          if [ "${{ steps.u28.outputs.more }}" = "true" ]; then
            echo "::warning::REPAIR_CONTINUES_NEXT_RUN: unit budget used up; checkpoints are saved, dispatch again to continue"
          fi
      - name: Persist state to automation-state branch
        if: always() && inputs.dry_run != 'true'
        run: python scripts/git_sync.py
