name: Sleep History Review Decision

on:
  workflow_dispatch:
    inputs:
      action:
        description: publish, reject, regenerate, or resume a review notification
        required: true
        type: choice
        options: [publish, reject, regenerate, notify-existing-review]
      identifier:
        description: Internet Archive identifier of the REVIEW_PENDING item
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: sleep-history-production
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply review decision
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE_ID: ${{ secrets.GEMINI_TTS_VOICE_ID }}
          GEMINI_TTS_VOICE_NAME: ${{ secrets.GEMINI_TTS_VOICE_NAME }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IAS3_ACCESS_KEY: ${{ secrets.IAS3_ACCESS_KEY }}
          IAS3_SECRET_KEY: ${{ secrets.IAS3_SECRET_KEY }}
          GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY }}
          PINK_NOISE_URL: ${{ secrets.PINK_NOISE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/cloud_pipeline.py "${{ inputs.action }}" --identifier "${{ inputs.identifier }}"
      - name: Request review of regenerated package
        if: inputs.action == 'regenerate'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cloud_pipeline.py notify-review
      - name: Persist decision
        if: always()
        run: |
          git config user.name "sleep-history-bot"
          git config user.email "marwalfarsi2000@gmail.com"
          git add config/topics_history.json config/topic_candidate_bank.json config/archive_index.json config/tts_usage.json config/tts_quota_state.json config/pronunciation_dictionary.json
          if ! git diff --cached --quiet; then
            git commit -m "Record review decision for ${{ inputs.identifier }}" || true
            for attempt in {1..3}; do
              if git pull --rebase origin HEAD && git push origin HEAD; then
                echo "Git persistence succeeded on attempt $attempt"
                break
              else
                echo "Git push failed on attempt $attempt"
                sleep 5
              fi
            done
          fi

