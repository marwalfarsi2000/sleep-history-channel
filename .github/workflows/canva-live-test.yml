name: Canva Live Test

# One manual, single-attempt Canva thumbnail through n8n: Lucid Origin background -> template autofill -> export.
# Nothing is published and no episode is touched. The result image is uploaded as an artifact and sent to Telegram.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Single Canva thumbnail
        env:
          CANVA_THUMBNAIL_WEBHOOK_URL: ${{ secrets.CANVA_THUMBNAIL_WEBHOOK_URL }}
        run: PYTHONPATH=scripts python scripts/canva_live_test.py
      - name: Send the image to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f canva-live-test/canva_thumbnail.jpg ]; then
            curl -sS -o /dev/null -w "telegram_http=%{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" -F "document=@canva-live-test/canva_thumbnail.jpg" \
              -F "caption=Canva live test (Lucid Origin + template, single thumbnail)" || echo "telegram_send_failed"
          else
            echo "no image to send"
          fi
      - name: Upload result for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canva-live-test-${{ github.run_id }}
          path: canva-live-test
          retention-days: 14
          if-no-files-found: warn
