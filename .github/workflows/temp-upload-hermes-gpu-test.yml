name: TEMP Upload Hermes GPU Test to Internet Archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-upload-hermes-gpu-test.yml"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IA_IDENTIFIER: hermes-gpu-video-test-20261021-cartoon-girl-night
      IA_FILENAME: hermes-cartoon-girl-night.mp4
      RELAY_URL: https://34-133-13-235.nip.io/webhook/ia-gpu-video-20261021-7f44b5c921c84c3a8d7a90e5
      EXPECTED_SIZE: "43984"
    steps:
      - name: Download generated video from temporary n8n relay
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$RELAY_URL" -o video.b64
          base64 --decode video.b64 > "$IA_FILENAME"
          test "$(stat -c%s "$IA_FILENAME")" = "$EXPECTED_SIZE"
          python - <<'PY'
          from pathlib import Path
          p = Path("hermes-cartoon-girl-night.mp4")
          data = p.read_bytes()
          if b"ftyp" not in data[:64]:
              raise SystemExit("MP4_SIGNATURE_CHECK_FAILED")
          print("LOCAL_MP4_SIZE", p.stat().st_size)
          PY
          sha256sum "$IA_FILENAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Internet Archive client
        run: pip install --disable-pip-version-check internetarchive==5.12.0

      - name: Upload to Internet Archive and verify original file
        env:
          IAS3_ACCESS_KEY: ${{ secrets.IAS3_ACCESS_KEY }}
          IAS3_SECRET_KEY: ${{ secrets.IAS3_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          from internetarchive import upload

          identifier = os.environ["IA_IDENTIFIER"]
          filename = os.environ["IA_FILENAME"]
          path = Path(filename)
          expected_size = path.stat().st_size
          expected_md5 = hashlib.md5(path.read_bytes(), usedforsecurity=False).hexdigest()
          expected_sha256 = hashlib.sha256(path.read_bytes()).hexdigest()

          responses = upload(
              identifier,
              {filename: str(path)},
              metadata={
                  "title": "Hermes GPU Video Test - Cartoon Girl Night Street",
                  "creator": "Hermes GPU Video Pilot",
                  "description": "One-second zero-cost GPU video generation test produced through Hermes using Hugging Face ZeroGPU and Lightricks LTX Video. Test artifact only.",
                  "mediatype": "movies",
                  "collection": "opensource_movies",
                  "date": "2026-10-21",
                  "subject": ["Hermes", "GPU test", "LTX Video", "animation test"],
              },
              headers={"x-archive-keep-old-version": "0", "x-archive-queue-derive": "1"},
              access_key=os.environ["IAS3_ACCESS_KEY"],
              secret_key=os.environ["IAS3_SECRET_KEY"],
              checksum=True,
              retries=5,
              retries_sleep=10,
              verbose=False,
          )
          for response in responses if isinstance(responses, list) else [responses]:
              status = getattr(response, "status_code", 200)
              if status >= 400:
                  raise RuntimeError(f"IA_UPLOAD_HTTP_{status}")

          url = f"https://archive.org/metadata/{identifier}"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      meta = json.loads(r.read().decode("utf-8"))
                  remote = next((f for f in meta.get("files", []) if f.get("name") == filename), None)
                  if remote:
                      rsize = int(remote.get("size") or 0)
                      rmd5 = str(remote.get("md5") or "").lower()
                      rsha = str(remote.get("sha256") or "").lower()
                      checksum_ok = (rmd5 == expected_md5) or (rsha and rsha == expected_sha256)
                      if rsize == expected_size and checksum_ok:
                          print("IA_UPLOAD=PASS")
                          print("IA_ITEM_URL=https://archive.org/details/" + identifier)
                          print("IA_VIDEO_URL=https://archive.org/download/" + identifier + "/" + filename)
                          print("SIZE=" + str(expected_size))
                          print("SHA256=" + expected_sha256)
                          raise SystemExit(0)
              except Exception as exc:
                  print("VERIFY_WAIT", attempt + 1, type(exc).__name__, str(exc)[:160])
              time.sleep(10)
          raise SystemExit("IA_REMOTE_VERIFICATION_FAILED")
          PY
